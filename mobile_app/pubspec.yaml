name: padanam_lms
description: Padanam – competitive exam LMS (Kerala PSC, SSC, RRB, KTET, UGC NET and more).
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  dio: ^5.7.0
  go_router: ^16.2.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  in_app_update: ^4.2.3
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  # store & payments
  razorpay_flutter: ^1.4.0
  share_plus: ^11.0.0
  # learning
  youtube_player_iframe: ^5.2.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  pdfrx: ^1.3.2
  flutter_widget_from_html_core: ^0.16.0
  # chat, push, deep links
  socket_io_client: ^3.1.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  app_links: ^6.4.0
  file_picker: ^10.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
